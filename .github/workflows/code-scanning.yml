name: Code scanning

# Uploads krepis's own SARIF to GitHub code scanning: the end-to-end check that GitHub accepts the file and shows each
# result at a file and line. The capture comes from packages/kit/examples/n-plus-one.ts, a deliberate N+1, so the
# alert it raises is expected. Pull requests from forks are skipped: their token cannot write security events.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: code-scanning-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sarif:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Start MongoDB
        run: |
          docker run -d --name krepis-mongo -p 27018:27018 mongo:8.0 --port 27018
          for i in $(seq 1 60); do
            docker exec krepis-mongo mongosh --port 27018 --quiet --eval 'db.runCommand({ ping: 1 })' >/dev/null 2>&1 && break
            sleep 1
          done

      # From the repository root, so capture call sites and SARIF paths are relative to it.
      - name: Capture the example
        env:
          KREPIS_CAPTURE: '1'
        run: node --conditions=krepis-source packages/kit/examples/n-plus-one.ts

      - name: Write SARIF
        run: node --conditions=krepis-source packages/kit/src/cli.ts analyze --format sarif --output krepis.sarif

      # Code scanning drops results without a location, so a missing one would pass the upload unseen.
      - name: Check every result has a location
        run: |
          jq -e '[.runs[].results[]] | length > 0' krepis.sarif >/dev/null || { echo 'no results in krepis.sarif'; exit 1; }
          jq -e '[.runs[].results[] | select(.locations == null)] | length == 0' krepis.sarif >/dev/null \
            || { echo 'results without a location:'; jq '[.runs[].results[] | select(.locations == null) | .ruleId]' krepis.sarif; exit 1; }

      # Waits for GitHub to process the file and fails if it is rejected.
      - uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: krepis.sarif
          category: krepis
